<script>
// Public site renderer. Reads the inlined manifest and builds the DOM for the
// chosen layout (topbar/sidebar tabs, or a landing scroll of full-bleed bands),
// applying the theme. Uses textContent / createElement only (never innerHTML)
// and an https/tel/mailto href allowlist, so no manifest field can inject markup
// or a javascript: URL even if server validation is bypassed.
(function () {
  "use strict";

  var FONTS = { system: 1, serif: 1, rounded: 1, mono: 1 };
  var MODES = { auto: 1, light: 1, dark: 1 };
  var GRADS = { sunset: 1, aurora: 1, blush: 1, mint: 1, slate: 1, dusk: 1 };
  var ACCENT_RE = /^#[0-9a-fA-F]{6}$/;

  var app = document.getElementById("app");
  var dataEl = document.getElementById("manifest");
  if (!app || !dataEl) return;

  var manifest;
  try {
    manifest = JSON.parse(dataEl.textContent);
  } catch (e) {
    app.textContent = "Failed to load site.";
    return;
  }

  // Derived per-manifest state — module-level so the render helpers below close
  // over them and `build()` can refresh them on each (re)render.
  var meta, theme, layout, mode, navPlacement, navSticky, sections, ids, brand, navHidden;
  var pages, activeIdx, multi;
  // True only inside the builder's live-preview iframe (page nav switches the
  // editor's active page there, rather than navigating client-side).
  var framed = !!(window.parent && window.parent !== window);

  // Derive everything from a manifest and (re)build #app. Called once on load;
  // in the builder it's called again on every edit so the preview updates in
  // place instead of reloading the iframe — which is what keeps scroll position
  // and the open tab from jumping back to the top.
  function build(m) {
    manifest = m || manifest;
    meta = manifest.meta || {};
    theme = manifest.theme || {};
    layout = manifest.layout;
    if (layout !== "sidebar" && layout !== "landing") layout = "topbar";
    // Page mode and nav placement are separable knobs. `layout` stays the mode
    // anchor (landing = one scrolling page, else tabbed sections); nav placement
    // (top / side / bottom) and stickiness are their own fields, defaulting
    // sensibly — a legacy "sidebar" layout means a side nav.
    mode = layout === "landing" ? "scroll" : "tabbed";
    navPlacement = /^(top|side|bottom)$/.test(manifest.navPlacement)
      ? manifest.navPlacement
      : (layout === "sidebar" ? "side" : "top");
    navSticky = manifest.navSticky !== false;

    // A site is one or more pages, each with its own sections. A legacy manifest
    // with a top-level `sections` array is treated as a single "Home" page, so
    // single-page sites render exactly as before.
    pages = (Array.isArray(manifest.pages) && manifest.pages.length) ? manifest.pages
      : [{ name: meta.name || "Home", slug: "", sections: Array.isArray(manifest.sections) ? manifest.sections : [] }];
    multi = pages.length > 1;
    activeIdx = (typeof manifest._active === "number" && manifest._active >= 0 && manifest._active < pages.length) ? manifest._active : 0;
    sections = Array.isArray(pages[activeIdx].sections) ? pages[activeIdx].sections : [];

    // Stable section ids. The server generates these on publish, but the builder
    // draft (previewed here) never sets one, so we synthesize a slugified,
    // de-duplicated id per section — mirroring the server's slugify+dedupe — and
    // use it everywhere instead of section.id.
    var seenIds = {};
    ids = sections.map(function (s, i) {
      var base = (s.id && String(s.id)) || slugifyId(s.label) || ("section-" + (i + 1));
      var id = base, n = 2;
      while (seenIds[id]) id = base + "-" + (n++);
      seenIds[id] = 1;
      return id;
    });

    brand = meta.brand || meta.name || "";
    navHidden = meta.navHidden === true;

    applyTheme(theme);
    document.title = meta.name || document.title;
    app.textContent = "";
    app.setAttribute("data-layout", layout);
    // Multi-page sites use the nav to switch pages; within a page the sections
    // stack (scroll bands), so force scroll styling in that case.
    app.setAttribute("data-page", multi ? "scroll" : mode);
    app.removeAttribute("data-nav");
    if (!navHidden) app.setAttribute("data-nav", navPlacement);
    app.removeAttribute("data-sticky");
    if (navSticky) app.setAttribute("data-sticky", "1");

    if (multi) { renderPageNav(); renderBands(); }
    else if (mode === "scroll") renderLanding();
    else renderTabbed();

    renderCredit();
  }

  // A small "Made with Website Wombat" credit at the foot of the finished site —
  // the share loop: every downloaded/shared site links a new visitor back to the
  // builder. Opt-out with meta.hideCredit (a toggle in the builder). The ?ref
  // tag says whether the click came from a shared link (the /v viewer marks
  // #app data-slug="datalink") or a downloaded file; the builder counts it.
  function renderCredit() {
    if (meta.hideCredit) return;
    var f = el("footer", "ww-credit");
    var a = document.createElement("a");
    a.className = "ww-credit-link";
    var ref = app.getAttribute("data-slug") === "datalink" ? "credit-shared" : "credit-download";
    a.href = "https://websitewombat.app/build?ref=" + ref;
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Made with Website Wombat — build a free site";
    f.appendChild(a);
    app.appendChild(f);
  }

  // Top nav that switches PAGES. Link behavior depends on context:
  //  • multi-file export (manifest._files present) → real <a href> to sibling files
  //  • builder preview (framed) → tells the editor to switch its active page
  //  • datalink / single-file → switches the active page client-side (re-render)
  function renderPageNav() {
    if (navHidden) return;
    var nav = el("nav", "ww-topnav");
    styleNav(nav);
    nav.appendChild(el("span", "ww-brand", brand));
    var links = el("div", "ww-navlinks");
    var files = manifest._files;
    pages.forEach(function (p, i) {
      if (p.showInNav === false) return;
      var label = p.navLabel || p.name || ("Page " + (i + 1));
      var a = document.createElement("a");
      a.textContent = label;
      if (files && files[i]) {
        a.href = files[i];
      } else {
        a.href = "#";
        a.addEventListener("click", function (e) {
          e.preventDefault();
          if (framed) { try { window.parent.postMessage({ ww: "gotopage", index: i }, "*"); } catch (err) {} }
          else { manifest._active = i; build(manifest); }
        });
      }
      if (i === activeIdx) a.className = "is-active";
      links.appendChild(a);
    });
    if (links.childNodes.length) nav.appendChild(links);
    app.appendChild(nav);
  }

  // Render the active page's sections as a stack of full-width bands.
  function renderBands() {
    sections.forEach(function (section, i) {
      var band = el("section", "ww-band");
      band.id = ids[i];
      band.setAttribute("data-ww-path", "s" + i);
      applyBackground(band, section.background || { type: "none" });
      applyFmt(band, sectionFmt(section));
      var inner = el("div", "ww-band-inner");
      (section.blocks || []).forEach(function (b, j) { renderBlock(inner, b, "s" + i + "/b" + j); });
      band.appendChild(inner);
      app.appendChild(band);
    });
  }

  // ================= LANDING =================
  function renderLanding() {
    if (!navHidden) {
      var nav = el("nav", "ww-topnav");
      styleNav(nav);
      nav.appendChild(el("span", "ww-brand", brand));
      var links = el("div", "ww-navlinks");
      sections.forEach(function (s, i) {
        if (s.showInNav === false) return;
        var targetId = ids[i];
        var a = document.createElement("a");
        a.href = "#" + targetId;
        a.textContent = s.navLabel || s.label || targetId;
        // Scroll in-page rather than let the browser navigate to the fragment.
        // In the builder's srcdoc preview a fragment nav re-parses the whole
        // document (re-running this script); this keeps it a smooth scroll and
        // still updates the hash so deep-links work on the published site.
        a.addEventListener("click", function (e) {
          e.preventDefault();
          var target = document.getElementById(targetId);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          try { history.replaceState(null, "", "#" + targetId); } catch (err) {}
        });
        links.appendChild(a);
      });
      if (links.childNodes.length) nav.appendChild(links);
      app.appendChild(nav);
    }
    renderBands();
  }

  function applyBackground(band, bg) {
    if (bg.type === "color" && ACCENT_RE.test(String(bg.value || ""))) {
      band.style.background = bg.value;
    } else if (bg.type === "gradient" && GRADS[bg.value]) {
      band.setAttribute("data-grad", bg.value);
    }
    if (bg.text === "light" || bg.text === "dark") band.setAttribute("data-text", bg.text);
  }

  // ================= TABBED (topbar / sidebar) =================
  function renderTabbed() {
    var header = el("header", "ww-header");
    header.appendChild(el("h1", "ww-name", brand));
    if (meta.tagline) header.appendChild(el("p", "ww-tagline", meta.tagline));
    var contact = el("p", "ww-contact");
    if (meta.telephone) contact.appendChild(anchor("tel:" + meta.telephone, meta.telephone));
    if (meta.email) {
      if (contact.childNodes.length) contact.appendChild(document.createTextNode("  ·  "));
      contact.appendChild(anchor("mailto:" + meta.email, meta.email));
    }
    if (meta.address) {
      if (contact.childNodes.length) contact.appendChild(document.createTextNode("  ·  "));
      contact.appendChild(anchor(directionsUrl(meta.address), meta.address));
    }
    if (contact.childNodes.length) header.appendChild(contact);
    app.appendChild(header);

    // Which sections get a tab. On a tabbed layout the tab strip is the only way
    // to switch panels, so a section hidden from the menu is omitted entirely
    // (tab + panel). Guardrail: if that would leave nothing, ignore the flags so
    // the site is never empty.
    var shown = sections.map(function (s, i) { return { s: s, i: i }; });
    if (!navHidden) {
      var vis = shown.filter(function (x) { return x.s.showInNav !== false; });
      if (vis.length) shown = vis;
    }

    var shell = el("div", "ww-shell");
    var nav = el("nav", "ww-tabs");
    styleNav(nav);
    nav.setAttribute("role", "tablist");
    var content = el("div", "ww-content");
    // navHidden degrades the tabbed layout to a single scroll of all panels, so
    // no content becomes unreachable once the tab strip is gone.
    if (!navHidden) shell.appendChild(nav);
    shell.appendChild(content);
    app.appendChild(shell);

    var panels = [];
    shown.forEach(function (entry) {
      var section = entry.s, sid = ids[entry.i];
      var tab = el("button", "ww-tab", section.navLabel || section.label || sid);
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.id = "tab-" + sid;
      tab.setAttribute("aria-controls", "panel-" + sid);

      var panel = el("section", "ww-panel");
      panel.id = "panel-" + sid;
      panel.setAttribute("data-ww-path", "s" + entry.i);
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", tab.id);
      applyFmt(panel, sectionFmt(section));
      (section.blocks || []).forEach(function (b, j) { renderBlock(panel, b, "s" + entry.i + "/b" + j); });

      var rec = { tab: tab, panel: panel, sid: sid };
      tab.addEventListener("click", function () {
        activate(panels.indexOf(rec));
        try { history.replaceState(null, "", "#" + sid); } catch (err) {}
      });
      if (!navHidden) nav.appendChild(tab);
      content.appendChild(panel);
      panels.push(rec);
    });

    function activate(index) {
      panels.forEach(function (p, i) {
        var on = i === index;
        p.tab.setAttribute("aria-selected", on ? "true" : "false");
        p.tab.classList.toggle("is-active", on);
        p.panel.hidden = !on;
      });
    }
    if (navHidden) {
      panels.forEach(function (p) { p.panel.hidden = false; });
    } else {
      var startId = (location.hash || "").replace(/^#/, "");
      var startIndex = panels.findIndex(function (p) { return p.sid === startId; });
      activate(startIndex >= 0 ? startIndex : 0);
    }
  }

  // ================= THEME =================
  function applyTheme(t) {
    var root = document.documentElement;
    if (ACCENT_RE.test(String(t.accent || ""))) root.style.setProperty("--ww-accent", t.accent);
    root.setAttribute("data-font", FONTS[t.font] ? t.font : "system");
    root.setAttribute("data-mode", MODES[t.mode] ? t.mode : "auto");
  }

  // ================= BLOCKS =================
  // `path` (e.g. "s0/b2" or "s0/b1/c0/b0") links this block back to the editor.
  // Every block renders into its own `.ww-blk` wrapper. The wrapper carries the
  // optional per-block format tokens (fmt) and is the single node stamped with
  // data-ww-path — so a block that emits several nodes still maps to one editor
  // card, and the builder can highlight it / trace clicks back to it.
  function renderBlock(parent, b, path) {
    var wrap = el("div", "ww-blk");
    var fn = b && RENDERERS[b.type];
    if (fn) fn(wrap, b, path);
    if (!wrap.childNodes.length) return; // block produced nothing (e.g. empty image)
    applyFmt(wrap, b.fmt);
    if (b.type !== "button") applyColors(wrap, b.fmt); // buttons colour the button itself
    if (path) {
      wrap.setAttribute("data-ww-path", path);
      wrap.className += " ww-editable";
    }
    parent.appendChild(wrap);
  }

  // Per-block presentation tokens → data-* on the wrapper (styled by site.css).
  // Allow-listed, like the theme gates above — no raw values reach the DOM.
  var FMT_ALIGN = { left: 1, center: 1, right: 1 };
  var FMT_SIZE = { s: 1, l: 1, xl: 1 };
  var FMT_COLOR = { muted: 1, accent: 1 };
  var FMT_SPACE = { tight: 1, roomy: 1 };
  var FMT_BG = { card: 1, accent: 1 };
  // Stamp allow-listed fmt tokens as data-* on an element (a block wrapper OR a
  // section container). Marks it .ww-fmt so the shared token CSS applies.
  function applyFmt(el, fmt) {
    if (!fmt || typeof fmt !== "object") return;
    var any = false;
    if (FMT_ALIGN[fmt.align]) { el.setAttribute("data-ww-align", fmt.align); any = true; }
    if (FMT_SIZE[fmt.size]) { el.setAttribute("data-ww-size", fmt.size); any = true; }
    if (FMT_COLOR[fmt.color]) { el.setAttribute("data-ww-color", fmt.color); any = true; }
    if (FMT_SPACE[fmt.space]) { el.setAttribute("data-ww-space", fmt.space); any = true; }
    if (FMT_BG[fmt.bg]) { el.setAttribute("data-ww-bg", fmt.bg); any = true; }
    if (any) el.className += (el.className ? " " : "") + "ww-fmt";
  }

  // Custom per-element colours: validated #rrggbb only → inline styles. Inline
  // wins over the enum-token CSS, so a custom colour overrides a preset. Applied
  // to a block wrapper (text/background/border) or, for a button, to the button
  // itself so "fill" recolours the button rather than the space around it.
  function applyColors(el, fmt) {
    if (!fmt || typeof fmt !== "object") return;
    if (ACCENT_RE.test(String(fmt.textColor || ""))) el.style.color = fmt.textColor;
    if (ACCENT_RE.test(String(fmt.bgColor || ""))) el.style.background = fmt.bgColor;
    if (ACCENT_RE.test(String(fmt.borderColor || ""))) el.style.border = "1px solid " + fmt.borderColor;
  }
  // Nav bar colours (theme.navBg / theme.navText) → inline bg + a --ww-nav-fg var
  // the nav CSS reads for brand/links/tabs. Validated hex only.
  function styleNav(navEl) {
    if (!theme) return;
    if (ACCENT_RE.test(String(theme.navBg || ""))) navEl.style.background = theme.navBg;
    if (ACCENT_RE.test(String(theme.navText || ""))) navEl.style.setProperty("--ww-nav-fg", theme.navText);
  }

  // A section's effective fmt = section.fmt, with the legacy `section.align`
  // (older templates / landing "center") folded in when fmt.align is unset.
  function sectionFmt(section) {
    var f = section.fmt || {};
    if (section.align && !f.align) return { align: section.align, size: f.size, color: f.color };
    return f;
  }

  // A prev/next arrow for a scroll gallery: scrolls it by one image per click.
  // With `loop`, next past the last image wraps to the first (and prev past the
  // first wraps to the last). stopPropagation so a click in the builder preview
  // doesn't also select the block.
  function galleryNav(gal, dir, glyph, label, loop) {
    var btn = el("button", "ww-gallery-nav ww-gallery-" + (dir < 0 ? "prev" : "next"), glyph);
    btn.type = "button";
    btn.setAttribute("aria-label", label);
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var item = gal.querySelector(".ww-gallery-item");
      var stepPx = item ? item.getBoundingClientRect().width + 10 : gal.clientWidth * 0.8;
      var maxLeft = gal.scrollWidth - gal.clientWidth;
      if (loop && dir > 0 && gal.scrollLeft >= maxLeft - 2) { gal.scrollTo({ left: 0, behavior: "smooth" }); return; }
      if (loop && dir < 0 && gal.scrollLeft <= 2) { gal.scrollTo({ left: maxLeft, behavior: "smooth" }); return; }
      gal.scrollBy({ left: dir * stepPx, behavior: "smooth" });
    });
    return btn;
  }

  // Full-size viewer (view mode only — in the builder, image clicks select the
  // block to edit). Click a gallery/image → dark overlay with the image; click
  // anywhere, the ✕, or Escape closes it.
  // `items` = [{src,alt}] from the clicked image's gallery; `idx` = which one.
  // With 2+ items the overlay gets ‹ / › (and arrow-key) navigation that wraps.
  function openLightbox(items, idx) {
    var ov = el("div", "ww-lightbox");
    var img = document.createElement("img");
    img.addEventListener("click", function (e) { e.stopPropagation(); }); // clicking the photo doesn't close
    function show() { var it = items[idx]; img.src = it.src; img.alt = it.alt || ""; }
    function go(d) { idx = (idx + d + items.length) % items.length; show(); }
    ov.appendChild(img);
    if (items.length > 1) {
      var prev = el("button", "ww-lightbox-nav ww-lightbox-prev", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Previous");
      var next = el("button", "ww-lightbox-nav ww-lightbox-next", "›"); next.type = "button"; next.setAttribute("aria-label", "Next");
      prev.addEventListener("click", function (e) { e.stopPropagation(); go(-1); });
      next.addEventListener("click", function (e) { e.stopPropagation(); go(1); });
      ov.appendChild(prev); ov.appendChild(next);
    }
    var close = el("button", "ww-lightbox-close", "✕"); close.type = "button"; close.setAttribute("aria-label", "Close");
    ov.appendChild(close);
    function done() { if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener("keydown", onKey); }
    function onKey(e) {
      if (e.key === "Escape") done();
      else if (items.length > 1 && e.key === "ArrowLeft") go(-1);
      else if (items.length > 1 && e.key === "ArrowRight") go(1);
    }
    ov.addEventListener("click", done); // click the backdrop (or ✕) to close
    document.addEventListener("keydown", onKey);
    show();
    document.body.appendChild(ov);
  }
  function setupLightbox() {
    // Capture phase + stopPropagation so an image click opens full size without
    // also triggering the builder's click-to-select-block bridge underneath.
    document.addEventListener("click", function (e) {
      var img = e.target.closest && e.target.closest(".ww-gallery-img, .ww-img");
      if (!img || !img.src) return;
      e.stopPropagation();
      var gal = img.closest(".ww-gallery"), items, idx = 0;
      if (gal) {
        var imgs = Array.prototype.slice.call(gal.querySelectorAll(".ww-gallery-img"));
        items = imgs.map(function (x) { return { src: x.src, alt: x.alt }; });
        idx = imgs.indexOf(img);
      } else { items = [{ src: img.src, alt: img.alt }]; }
      openLightbox(items, idx < 0 ? 0 : idx);
    }, true);
  }

  // One renderer per block type. Each appends its DOM to `parent`; renderBlock
  // stamps the paths afterward. Only `columns` recurses (and needs `path`).
  var RENDERERS = {
    heading: function (parent, b) { parent.appendChild(el("h2", "ww-h", b.text || "")); },
    text: function (parent, b) { parent.appendChild(el("p", "ww-p", b.text || "")); },
    list: function (parent, b) {
      var list = el(b.style === "number" ? "ol" : "ul", "ww-list");
      (b.items || []).forEach(function (i) { list.appendChild(el("li", null, i)); });
      parent.appendChild(list);
    },
    image: function (parent, b) {
      var isrc = imgSrc(b);
      if (isrc) parent.appendChild(imageEl(isrc, b.alt, "ww-img"));
    },
    gallery: function (parent, b) {
      var scroll = b.layout === "scroll";
      var gal = el("div", "ww-gallery");
      // grid = uniform rows that wrap; scroll = a horizontal swipe/snap strip.
      gal.setAttribute("data-layout", scroll ? "scroll" : "grid");
      (b.images || []).forEach(function (im) {
        var gsrc = imgSrc(im);
        if (!gsrc) return;
        var item = el("div", "ww-gallery-item");
        item.appendChild(imageEl(gsrc, im.alt, "ww-gallery-img"));
        gal.appendChild(item);
      });
      if (!gal.childNodes.length) return;
      // A scroll strip with 2+ images gets clickable prev/next arrows (swipe still works).
      if (scroll && gal.childNodes.length > 1) {
        var wrap = el("div", "ww-gallery-wrap");
        wrap.appendChild(galleryNav(gal, -1, "‹", "Previous images", b.loop === true));
        wrap.appendChild(gal);
        wrap.appendChild(galleryNav(gal, 1, "›", "Next images", b.loop === true));
        parent.appendChild(wrap);
      } else {
        parent.appendChild(gal);
      }
    },
    // Label→value rows. style "hours" = a compact schedule (<dl>); anything else
    // = a price list with an optional per-row note. Menu and Hours are presets
    // of this one primitive.
    rows: function (parent, b) {
      var items = b.items || [];
      if (b.style === "hours") {
        var dl = el("dl", "ww-hours");
        items.forEach(function (it) {
          dl.appendChild(el("dt", null, it.label || ""));
          dl.appendChild(el("dd", null, it.value || ""));
        });
        parent.appendChild(dl);
        return;
      }
      if (b.title) parent.appendChild(el("h3", "ww-menu-title", b.title));
      var wrap = el("div", "ww-menu");
      items.forEach(function (it) {
        var row = el("div", "ww-menu-item");
        var head = el("div", "ww-menu-head");
        head.appendChild(el("span", "ww-menu-name", it.label || ""));
        if (it.value) head.appendChild(el("span", "ww-menu-price", it.value));
        row.appendChild(head);
        if (it.note) row.appendChild(el("div", "ww-menu-desc", it.note));
        wrap.appendChild(row);
      });
      parent.appendChild(wrap);
    },
    button: function (parent, b) {
      var href = buttonHref(b.action);
      if (!href) return;
      var btn = anchor(href, b.label || "");
      btn.className = "ww-btn";
      applyColors(btn, b.fmt); // fill / text / border custom colours land on the button
      parent.appendChild(btn);
    },
    social: function (parent, b) {
      var row = el("div", "ww-social");
      (b.links || []).forEach(function (l) {
        var a = anchor(l.url, platformLabel(l.platform));
        a.className = "ww-social-link";
        a.setAttribute("data-platform", l.platform);
        a.rel = "noopener"; a.target = "_blank";
        if (a.href) row.appendChild(a);
      });
      if (row.childNodes.length) parent.appendChild(row);
    },
    divider: function (parent) { parent.appendChild(el("hr", "ww-divider")); },
    hero: function (parent, b) {
      var hero = el("div", "ww-hero");
      hero.setAttribute("data-align", b.align === "split" ? "split" : "center");
      var textcol = el("div", "ww-hero-text");
      if (b.eyebrow) textcol.appendChild(el("p", "ww-eyebrow", b.eyebrow));
      if (b.headline) textcol.appendChild(el("h1", "ww-hero-h", b.headline));
      if (b.subhead) textcol.appendChild(el("p", "ww-hero-sub", b.subhead));
      if (b.buttons && b.buttons.length) {
        var actions = el("div", "ww-hero-actions");
        b.buttons.forEach(function (btn, i) {
          var href = buttonHref(btn.action);
          if (!href) return;
          var a = anchor(href, btn.label || "");
          a.className = "ww-btn" + (i > 0 ? " ww-btn-outline" : "");
          actions.appendChild(a);
        });
        if (actions.childNodes.length) textcol.appendChild(actions);
      }
      hero.appendChild(textcol);
      var hsrc = b.image && imgSrc(b.image);
      if (hsrc) {
        var media = el("div", "ww-hero-media");
        media.appendChild(imageEl(hsrc, b.image.alt, "ww-hero-img"));
        hero.appendChild(media);
      }
      parent.appendChild(hero);
    },
    columns: function (parent, b, path) {
      var cols = el("div", "ww-columns");
      cols.setAttribute("data-style", b.style === "card" ? "card" : "plain");
      (b.columns || []).forEach(function (col, k) {
        var c = el("div", "ww-col");
        (col.blocks || []).forEach(function (cb, m) { renderBlock(c, cb, path ? path + "/c" + k + "/b" + m : ""); });
        cols.appendChild(c);
      });
      parent.appendChild(cols);
    },
  };


  // Images are embedded inline as data:image URIs (the builder compresses on
  // upload / URL-fetch) so the site travels self-contained. The ZIP export
  // instead writes each photo to an images/ file and points src at it.
  function imgSrc(b) {
    var s = b && b.src;
    if (typeof s !== "string" || !s) return "";
    if (/^data:image\//i.test(s)) return s;      // embedded (preview / datalink / .html)
    if (/^images\/[\w.\-]+$/.test(s)) return s;  // ZIP export: local image file
    return "";
  }

  function imageEl(src, alt, cls) {
    var img = document.createElement("img");
    img.className = cls;
    img.loading = "lazy";
    img.alt = alt || "";
    img.src = src;
    return img;
  }

  function buttonHref(action) {
    if (!action) return "";
    switch (action.type) {
      case "tel": return action.value ? "tel:" + action.value : "";
      case "mailto": return action.value ? "mailto:" + action.value : "";
      case "url": return safeHttps(action.value);
      case "directions": return action.value ? directionsUrl(action.value) : (meta.address ? directionsUrl(meta.address) : "");
      default: return "";
    }
  }

  function platformLabel(p) {
    var names = { instagram: "Instagram", facebook: "Facebook", x: "X", tiktok: "TikTok", youtube: "YouTube", whatsapp: "WhatsApp", website: "Website" };
    return names[p] || "Link";
  }
  function directionsUrl(address) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);
  }
  // Mirrors the server's slugify (worker/manifest.js) so preview ids match published.
  function slugifyId(input) {
    return String(input || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[^\w\s-]/g, "")
      .trim()
      .replace(/[\s_]+/g, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 40);
  }

  // ---- safe DOM + href helpers ----
  function safeHttps(v) {
    try { var u = new URL(String(v)); return u.protocol === "https:" ? u.href : ""; } catch (e) { return ""; }
  }
  function anchor(href, text) {
    var a = document.createElement("a");
    if (/^(tel:|mailto:)/.test(href)) a.href = href;
    else { var s = safeHttps(href); if (s) a.href = s; }
    a.textContent = text;
    return a;
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // ---- builder bridge ----
  // Only when framed (the builder's live-preview iframe) — never on the published
  // site, datalink viewer, or downloaded copy, which all run top-level. Enables
  // two-way sync: the editor highlights a block here, and clicks here jump the
  // editor to the matching block.
  if (window.parent && window.parent !== window) setupBuilderBridge();
  setupLightbox(); // click any image for full size (builder preview, viewer, and downloads)

  function setupBuilderBridge() {
    document.documentElement.setAttribute("data-ww-editing", "1");
    var style = document.createElement("style");
    style.textContent =
      "[data-ww-editing] .ww-editable{cursor:pointer}" +
      "[data-ww-editing] .ww-editable:hover{outline:2px dashed rgba(110,168,254,.6);outline-offset:2px}" +
      ".ww-hl{outline:2px solid var(--ww-accent,#2563eb)!important;outline-offset:2px;border-radius:4px}" +
      ".ww-pulse{animation:ww-pulse 1.1s ease-out}" +
      "@keyframes ww-pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}100%{box-shadow:0 0 0 14px rgba(37,99,235,0)}}";
    (document.head || document.documentElement).appendChild(style);

    // Parent → preview messages: highlight a block, or re-render a new manifest.
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (!d) return;
      if (d.ww === "highlight") { applyHighlight(d.path, d.scroll, d.pulse); return; }
      if (d.ww === "manifest" && d.manifest) rebuild(d.manifest);
    });

    // Preview → parent: a click on any block selects it in the editor. Capture
    // phase + preventDefault on links/buttons so the preview never navigates or
    // submits out from under the builder (the tab strip carries no path, so tab
    // switching still works).
    document.addEventListener("click", function (e) {
      var host = e.target.closest && e.target.closest("[data-ww-path]");
      if (!host) return;
      var link = e.target.closest("a,button");
      if (link) e.preventDefault();
      window.parent.postMessage({ ww: "select", path: host.getAttribute("data-ww-path") }, "*");
    }, true);
  }

  // Re-render in place from a new manifest, preserving scroll, the open tab, and
  // any active highlight — so an edit never yanks the preview back to the top.
  var hlPath = null;
  function rebuild(m) {
    var x = window.scrollX, y = window.scrollY;
    var activeTab = document.querySelector(".ww-tab.is-active");
    var activeSid = activeTab ? activeTab.id.replace(/^tab-/, "") : null;
    build(m);
    if (activeSid) {
      var t = document.getElementById("tab-" + activeSid);
      if (t) t.click();
    }
    window.scrollTo(x, y);
    if (hlPath) applyHighlight(hlPath, false, false);
  }

  function applyHighlight(path, scroll, pulse) {
    var prev = document.querySelectorAll(".ww-hl, .ww-pulse");
    for (var i = 0; i < prev.length; i++) { prev[i].classList.remove("ww-hl"); prev[i].classList.remove("ww-pulse"); }
    hlPath = path || null;
    if (!path) return;
    var node = findByPath(path);
    if (!node) return;
    // If the target lives in a hidden tab panel, switch to its tab first.
    var panel = node.closest && node.closest(".ww-panel");
    if (panel && panel.hidden) {
      var tab = document.getElementById(panel.getAttribute("aria-labelledby") || "");
      if (tab) tab.click();
    }
    node.classList.add("ww-hl");
    if (pulse) { node.classList.add("ww-pulse"); setTimeout(function () { node.classList.remove("ww-pulse"); }, 1100); }
    if (scroll && node.scrollIntoView) node.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function findByPath(path) {
    var all = document.querySelectorAll("[data-ww-path]");
    for (var i = 0; i < all.length; i++) { if (all[i].getAttribute("data-ww-path") === path) return all[i]; }
    return null;
  }

  // Kick off the first render (helpers + RENDERERS above are all defined by now).
  build(manifest);
})();

</script>
</body>
</html>
